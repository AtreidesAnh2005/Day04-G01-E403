# starter_v0 — v2 tool declarations
#
# v2 hypothesis:
# The agent already chooses the correct tool, but the clarify/send argument
# contract is still ambiguous. Make response_type explicit and prioritize
# confirmation before side-effecting actions.
#
# Keep tool names synchronized with:
#   this file -> tools/__init__.py -> eval files

tools:
  # ---------------- Core tools ----------------
  - name: clarify
    description: >
      Ask exactly one clarification or confirmation question.

      Priority rule:
      1. When the user requests a side-effecting action such as send, post,
         publish, or deliver, ask for explicit confirmation first by setting
         response_type="yes_no". Do this even when the user refers to content
         indirectly with phrases such as "this newsletter", "this summary",
         "this message", or similar wording. Do not ask for the referenced
         content first in that turn.
      2. When a required free-text value is missing, such as an account handle,
         URL, topic, or recipient, ask for that value with
         response_type="text".

      Never guess missing handles, URLs, recipients, destinations, or
      confirmation. Always include response_type explicitly in the tool
      arguments.
    parameters:
      type: object
      properties:
        question:
          type: string
          default: ""
          description: >
            A concise question asking either for one missing value or for
            explicit confirmation. For a side-effecting action, ask whether
            the user confirms the proposed action rather than asking for the
            referenced content first.
        response_type:
          type: string
          enum: [text, yes_no, choice]
          default: "text"
          description: >
            This argument must always be included. Use "text" when requesting
            a missing handle, URL, topic, recipient, or other free-text value.
            Use "yes_no" when asking for confirmation before send, post,
            publish, deliver, or another side-effecting action. Use "choice"
            only when presenting explicit options and provide those options in
            the options field.
        options:
          type: array
          default: []
          items:
            type: string
          description: >
            Candidate choices shown to the user. Keep this empty unless
            response_type="choice".
      required: [question, response_type]

  - name: timeline
    description: "Lấy các bài đăng gần đây."
    parameters:
      type: object
      properties:
        screenname: {type: string, default: "", description: "Tên tài khoản"}
        limit: {type: integer, default: 5, description: "Số lượng"}
      required: [screenname]

  - name: social_search
    description: "Tìm trên mạng xã hội."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Từ khóa"}
        search_type: {type: string, enum: [Latest, Top], default: "Latest", description: "Cách sắp xếp"}
        limit: {type: integer, default: 5, description: "Số lượng"}
      required: [query]

  - name: lookup
    description: "Tra cứu thông tin trên internet."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Truy vấn"}
        topic: {type: string, enum: [general, news], default: "general", description: "Phân loại"}
        timeframe: {type: string, enum: [day, week, month, year], default: "week", description: "Khoảng thời gian"}
        max_results: {type: integer, default: 5, description: "Số kết quả"}
      required: [query]

  - name: fetch
    description: "Lấy nội dung từ một địa chỉ."
    parameters:
      type: object
      properties:
        url: {type: string, default: "", description: "Địa chỉ"}
      required: [url]

  - name: format
    description: "Trình bày dữ liệu đã có thành văn bản."
    parameters:
      type: object
      properties:
        items:
          type: array
          default: []
          description: "Danh sách item"
          items:
            type: object
            properties:
              title: {type: string}
              url: {type: string}
              source: {type: string}
              summary: {type: string}
              section: {type: string}
        template: {type: string, enum: [brief, sections, bullets, thread, daily_ai_vn], default: "sections", description: "Khuôn"}
        headline: {type: string, default: "", description: "Tiêu đề"}
      required: [items, template]

  # ---------------- Bonus tools ----------------
  - name: send
    description: >
      Perform a side-effecting send, post, publish, or delivery action.

      Do not call this tool on the user's initial request to send, post,
      publish, or deliver content. First call clarify with
      response_type="yes_no" and ask the user to explicitly confirm the
      proposed action.

      Call send only after the user has clearly confirmed the exact action.
      A request such as "send this", "post this newsletter", or
      "publish this summary" is an action request, not confirmation.
    parameters:
      type: object
      properties:
        text:
          type: string
          default: ""
          description: >
            The exact content to send only after explicit user confirmation.
        confirmed:
          type: boolean
          default: false
          description: >
            Set to true only after the user explicitly confirms the proposed
            send, post, publish, or delivery action. Never infer confirmation
            from the original request, a draft request, an ambiguous response,
            or earlier discussion.
      required: [text]

  - name: policy
    description: "Tìm trong tài liệu nội bộ."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Truy vấn"}
        policy_area: {type: string, enum: [all, ai_research, source_citation, data_privacy, external_publishing, tool_usage], default: "all", description: "Nhóm"}
        top_k: {type: integer, default: 3, description: "Số mục"}
      required: [query]

  - name: papers
    description: "Tìm bài báo khoa học."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Từ khóa"}
        max_results: {type: integer, default: 5, description: "Số lượng"}
        sort_by: {type: string, enum: [relevance, lastUpdatedDate, submittedDate], default: "relevance", description: "Sắp xếp"}
      required: [query]

  - name: paper_text
    description: "Lấy nội dung text của một bài báo."
    parameters:
      type: object
      properties:
        arxiv_url: {type: string, default: "", description: "ID hoặc địa chỉ"}
        max_pages: {type: integer, default: 5, description: "Số trang"}
        max_chars: {type: integer, default: 8000, description: "Số ký tự"}
      required: [arxiv_url]

  - name: source_compare
    description: >
      Compare two or more source items that have already been collected.

      This tool only analyzes the text and metadata supplied in `items`.
      It does not search the web, fetch URLs, call external APIs or LLMs,
      verify facts, determine which source is correct, or rank source
      trustworthiness.

      Use this tool when the user asks to compare source coverage,
      agreements, unique claims, potential conflicts, or missing metadata.

      Do not call this tool until source items are already available.
    parameters:
      type: object
      properties:
        items:
          type: array
          minItems: 2
          description: >
            Two or more previously collected source items. Each item should
            contain any available fields such as title, URL, source name,
            summary, section, publication date, or other source metadata.
          items:
            type: object
            properties:
              title:
                type: string
                description: "Tiêu đề nguồn."
              url:
                type: string
                description: "URL của nguồn nếu có."
              source:
                type: string
                description: "Tên trang, tổ chức hoặc nhà xuất bản."
              summary:
                type: string
                description: >
                  Nội dung, claim hoặc phần tóm tắt được dùng để so sánh.
              section:
                type: string
                description: "Nhóm hoặc section nếu có."
              published_at:
                type: string
                description: "Ngày hoặc thời điểm xuất bản nếu có."

        criterion:
          type: string
          enum: [coverage, agreement, conflicts]
          default: coverage
          description: >
            Comparison mode. Use "coverage" for a complete comparison
            containing agreements, unique claims, potential conflicts, and
            missing metadata. Use "agreement" when the user only wants common
            or supporting claims. Use "conflicts" when the user specifically
            wants contradictory or potentially conflicting claims.

        max_items:
          type: integer
          default: 5
          minimum: 2
          description: >
            Maximum number of source items to analyze. The default is 5.

      required: [items]